<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8" />
    <title>MathAddict Popup</title>
    <style>
        h1 {
            text-align: center;
        }

        body {
            margin: 0;
            padding: 1.5rem;
            background-color: #04191a;
            font-family: 'Segoe UI', sans-serif;
            color: #9fa0fd;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 175px;
        }

        button {
            background-color: #04191a;
            color: #b9b8d7;
            border: 2px solid #9fa0fd;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px #162938;
        }

        button:disabled {
            background-color: #b9b8d7;
            color: #162938;
            cursor: not-allowed;
        }

        #status {
            color: #b9b8d7;
            padding: 0.6rem 1.2rem;
            font-size: 0.90rem;
            font-weight: bold;
        }

        #content, #buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .toggle input {
            display: none;
        }

        .slider {
            width: 40px;
            height: 20px;
            background-color: #162938;
            border-radius: 20px;
            position: relative;
            transition: background-color 0.2s ease;
            border: 2px solid #9fa0fd;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #9fa0fd;
            border-radius: 50%;
            top: 2px;
            left: 1px;
            transition: transform 0.2s ease;
        }

        input:checked + .slider {
            background-color: #9fa0fd;
        }

        input:checked + .slider::before {
            transform: translateX(20px);
        }

    </style>
</head>
<body>
    <div id="content">
        <h1> Welcome to <br> Math Addict! </h1>
        <div id="buttons">
            <button id="appendDiv">Start</button>
            <button id="connectHw">TLNS</button>
            <label class="toggle">
                <span>TLNS Auto‑Start</span>
                <input type="checkbox" id="tlnsToggle">
                <span class="slider"></span>
            </label>
            <button id="removeDiv">Quit</button>
        </div>
        <div id="status"></div>
    </div>

    <script type="module">
        const status = document.getElementById('status');
        document.getElementById('appendDiv').addEventListener('click', () => {
            status.textContent = 'MA Running!';
        });
        document.getElementById('connectHw').addEventListener('click', () => {
            status.textContent = 'Connecting TLNS!';
        });
        document.getElementById('removeDiv').addEventListener('click', () => {
            status.textContent = 'MA Shut Down!';
        });
    </script>
    <script type="module" src="./popup.js"></script>
</body>
</html>
